'use strict';
(function(){
const $=s=>document.querySelector(s), DAYS=['mon','tue','wed','thu','fri','sat'], BOARDS=[...DAYS,'week'], VIEWS=['overview','members','leaderboards','opponent','trends','stages','data'];

const team=o=>o?`[${o.tag}] ${o.name}`:'—', day=d=>t(d==='week'?'week_board':d), pill=(text,cls='')=>`<span class="pill ${cls}">${esc(text)}</span>`;

function bars(items,title,names={}){const W=Math.min(720,Math.max(300,(window.innerWidth||792)-72)),H=240,left=70,bottom=40,top=25,plotH=H-top-bottom,{step,max}=niceScale(Math.max(0,...items.flatMap(x=>[x.home||0,x.opp||0]))),ticks=Math.round(max/step),group=(W-left-15)/Math.max(1,items.length);let out=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title>`;for(let i=0;i<=ticks;i++){const y=top+plotH*i/ticks;out+=`<line x1="${left}" x2="${W-15}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${left-8}" y="${y+4}" text-anchor="end" fill="currentColor" font-size="11">${esc(n((ticks-i)*step,true))}</text>`}items.forEach((x,i)=>{const gx=left+group*i,bw=Math.min(28,group*.3);['home','opp'].forEach((side,j)=>{const h=(x[side]||0)/max*plotH;out+=`<rect x="${gx+group*.18+j*bw}" y="${top+plotH-h}" width="${Math.max(1,bw-2)}" height="${h}" fill="var(--${side})"><title>${esc(x.label+' · '+(names[side]||(side==='home'?team(data.summary.home):team(data.summary.opponent)))+': '+n(x[side]||0))}</title></rect>`});if(i%Math.max(1,Math.ceil(items.length/(W<400?4:8)))===0||items.length<=6)out+=`<text x="${gx+group/2}" y="${H-17}" text-anchor="middle" fill="currentColor" font-size="11">${esc(x.label)}</text>`});return out+'</svg>'}

async function render(){const token=++renderToken;chrome();sync();$('#view').setAttribute('aria-busy','true');$('#view').innerHTML=`<p class="empty">${esc(t('loading'))}</p>`;try{if(!state.week)throw Error('No manifest');const w=await loadWeek(state.week);if(token!==renderToken)return;data=w;$('#view').innerHTML=state.view==='overview'?overview():state.view==='members'?members():state.view==='opponent'?members(true):state.view==='leaderboards'?leaderboards():state.view==='stages'?stages():state.view==='data'?dataView():`<p class="empty">${esc(t('loading'))}</p>`;if(state.view==='trends')await trends(token);if(state.player)await openProfile(state.player,false)}catch(e){if(token===renderToken){$('#view').innerHTML=errorBox();console.error(e)}}finally{if(token===renderToken)$('#view').setAttribute('aria-busy','false')}}
function rosterUpdate(){if($('#rosterTable'))$('#rosterTable').innerHTML=rosterTable(state.view==='opponent');if($('#boardTable'))$('#boardTable').innerHTML=boardTable()}
async function openProfile(key,setLink=true){const token=++profileToken,selectedWeek=state.week;let profileWeek=selectedWeek,p=everyone(data).find(p=>p.key===key);if(!p){try{const weeks=historyCache||await allWeeks();if(token!==profileToken)return;const match=weeks.slice().reverse().map(w=>({id:w.summary.id,p:everyone(w).find(p=>p.key===key)})).find(x=>x.p);p=match?.p;if(match)profileWeek=match.id}catch(e){}}if(!p){const r=BOARDS.flatMap(d=>(data.boards[d]||[]).map(r=>({...r,board:d}))).find(r=>boardKey(r,r.board)===key);if(r)p={key,player:r.player,tag:r.alliance_tag,weekly_points:null,days:{}}}if(!p){state.player='';sync();return}if(token!==profileToken)return;state.player=key;sync();const dialog=$('#profile');if(!dialog.open){lastProfileFocus=document.activeElement?.closest?.('#searchResults')?$('#globalSearch'):document.activeElement;dialog.showModal()}$('#profileBody').innerHTML=`<div class="dialog-top"><div><div class="eyebrow">[${esc(p.tag)}] · ${esc(date(profileWeek))}</div><h2 id="profileTitle">${esc(p.player)}</h2></div><button id="closeProfile" aria-label="${esc(t('close'))}">✕</button></div>${profileWeek!==selectedWeek?`<p class="note">${esc(t('profile_absent',{date:date(profileWeek)}))}</p>`:''}<div class="metrics"><div class="metric"><strong>${n(p.weekly_points,true)}</strong><span>${esc(t('weekly_points'))}</span></div><div class="metric"><strong>${n(p.active_days)}</strong><span>${esc(t('active_days'))}</span></div><div class="metric"><strong>${n(weeklyRank(p))}</strong><span>${esc(t('alliance_rank'))}</span></div><div class="metric"><strong>${pct(p.share)}</strong><span>${esc(t('share'))}</span></div></div><h3>${esc(t('stage_points'))}</h3>${bars(DAYS.map(d=>({label:day(d),home:p.days?.[d]?.points||0,opp:0})),t('stage_points'),{home:p.player})}<h3>${esc(t('daily_ranks'))}</h3>${wrapTable([t('days'),t('points'),t('overall_rank'),t('alliance_rank')].map(esc),DAYS.map(d=>`<tr><td>${esc(day(d))}</td><td>${n(p.days?.[d]?.points)}</td><td>${n(p.days?.[d]?.rank)}</td><td>${n(p.days?.[d]?.alliance_rank)}</td></tr>`).join(''))}<section style="margin-top:20px" id="profileHistory"><h3>${esc(t('history'))}</h3><p class="muted">${esc(t('loading'))}</p></section>`;$('#closeProfile').focus();try{const weeks=historyCache||await allWeeks();historyCache=weeks;if(token!==profileToken||!dialog.open)return;const hist=weeks.map(w=>({id:w.summary.id,p:everyone(w).find(p=>p.key===key)})).filter(x=>x.p&&!leftPlayer(x.p)),vals=hist.map(x=>x.p.weekly_points),sum=vals.reduce((a,b)=>a+b,0),best=hist.reduce((a,b)=>!a||b.p.weekly_points>a.p.weekly_points?b:a,null);$('#profileHistory').innerHTML=`<h3>${esc(t('history'))}</h3><p class="muted small">${esc(t('live_history_note'))}</p>${spark(vals,t('weekly_points'))}<div class="metrics"><div class="metric"><strong>${n(hist.length)}</strong><span>${esc(t('weeks_played'))}</span></div><div class="metric"><strong>${n(hist.length?sum/hist.length:0,true)}</strong><span>${esc(t('average'))}</span></div><div class="metric"><strong>${n(best?.p.weekly_points,true)}</strong><span>${esc(t('best_week'))} · ${best?esc(date(best.id)):'—'}</span></div></div>${wrapTable([t('week'),t('weekly_points'),t('rank')].map(esc),hist.map(x=>`<tr><td>${esc(date(x.id))}</td><td>${n(x.p.weekly_points)}</td><td>${n(x.p.alliance_rank)}</td></tr>`).join(''))}`}catch(e){if(token===profileToken)$('#profileHistory').innerHTML=`<p>${esc(t('error'))}</p>`}}
function closeProfile(){++profileToken;$('#profile').close();state.player='';sync();lastProfileFocus?.isConnected&&lastProfileFocus.focus()}
function csv(rows){if(!rows.length)return '';const keys=[...new Set(rows.flatMap(Object.keys))],cell=v=>'"'+String(typeof v==='object'&&v!==null?JSON.stringify(v):typeof v==='string'&&/^[=+\-@\t\r]/.test(v)?"'"+v:v??'').replace(/"/g,'""')+'"';return '\uFEFF'+[keys.map(cell).join(','),...rows.map(r=>keys.map(k=>cell(r[k])).join(','))].join('\r\n')}
function download(which,format){const rows=which==='visible'?visibleBoard():which==='members'?data.members:data.boards[which];const blob=new Blob([format==='json'?JSON.stringify(rows,null,2):csv(rows)],{type:format==='json'?'application/json;charset=utf-8':'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`VS-${state.week}-${which==='visible'?state.tab:which}.${format}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2200)}
function search(){const q=$('#globalSearch').value.trim().toLocaleLowerCase(),box=$('#searchResults');const matches=q&&data?everyone(data).filter(p=>p.player.toLocaleLowerCase().includes(q)).slice(0,12):[];box.hidden=!q;$('#globalSearch').setAttribute('aria-expanded',String(!!q));box.innerHTML=matches.length?matches.map(p=>`<button data-player="${esc(p.key)}"><span>${esc(p.player)}</span><span class="muted">[${esc(p.tag)}]</span></button>`).join(''):`<p class="small muted">${esc(t('no_results'))}</p>`}
$('#langSelect').innerHTML=Object.entries(window.LANG_NAMES||{}).map(([key,name])=>`<option value="${key}">${esc(name)}</option>`).join('');
$('#weekSelect').addEventListener('change',e=>{closeProfile();state.week=e.target.value;state.query='';$('#globalSearch').value='';$('#searchResults').hidden=true;render()});
$('#langSelect').addEventListener('change',e=>{lang=e.target.value;persist('p1mp.lang',lang);render()});
$('#themeToggle').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';persist('p1mp.theme',document.documentElement.dataset.theme);theme();sync()});
$('#copyLink').addEventListener('click',async()=>{sync();try{await navigator.clipboard.writeText(location.href);toast(t('copied'))}catch(e){$('#linkText').value=location.href;$('#linkDialog').showModal();$('#linkText').select()}});
$('#closeLink').addEventListener('click',()=>$('#linkDialog').close());
$('#globalSearch').addEventListener('input',search);
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();$('#searchResults button')?.focus()}if(e.key==='Enter'){const b=$('#searchResults button');if(b)b.click()}if(e.key==='Escape'){$('#searchResults').hidden=true;$('#globalSearch').setAttribute('aria-expanded','false')}});
$('#searchResults').addEventListener('keydown',e=>{const items=[...$('#searchResults').querySelectorAll('button')],i=items.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length]?.focus()}if(e.key==='Escape'){$('#globalSearch').focus();$('#searchResults').hidden=true;$('#globalSearch').setAttribute('aria-expanded','false')}});
$('#profile').addEventListener('cancel',e=>{e.preventDefault();closeProfile()});
$('#profile').addEventListener('click',e=>{if(e.target===$('#profile')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeProfile()}});
document.addEventListener('click',e=>{if(!e.target.closest('.search')){$('#searchResults').hidden=true;$('#globalSearch').setAttribute('aria-expanded','false')}const b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;state.query='';state.tier='all';state.quota='all';state.active=false;render().then(()=>$('#tab-'+state.view)?.focus())}else if(b.dataset.board){state.tab=b.dataset.board;render().then(()=>$('#board-'+state.tab)?.focus())}else if(b.dataset.player){$('#searchResults').hidden=true;$('#globalSearch').setAttribute('aria-expanded','false');openProfile(b.dataset.player)}else if(b.dataset.sort){state.direction=state.sort===b.dataset.sort?-state.direction:1;state.sort=b.dataset.sort;rosterUpdate();document.querySelector('[data-sort="'+state.sort+'"]')?.focus()}else if(b.dataset.download)download(b.dataset.download,b.dataset.format);else if(b.id==='closeProfile')closeProfile();else if(b.id==='retry')render()});
document.addEventListener('input',e=>{if(e.target.id==='rosterSearch'||e.target.id==='boardSearch'){state.query=e.target.value;rosterUpdate()}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='tierFilter')state.tier=e.target.value;else if(id==='quotaFilter')state.quota=e.target.value;else if(id==='activeFilter')state.active=e.target.checked;else if(id==='includeLeftFilter')state.includeLeft=e.target.checked;else if(id==='sideFilter')state.side=e.target.value;else return;rosterUpdate()});
document.addEventListener('keydown',e=>{const b=e.target.closest('[role=tab]');if(!b)return;const tabs=[...b.parentElement.querySelectorAll('[role=tab]')],i=tabs.indexOf(b);let j;if(e.key==='ArrowRight')j=(i+1)%tabs.length;else if(e.key==='ArrowLeft')j=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=tabs.length-1;else return;e.preventDefault();tabs[j].click();tabs[j].focus()});
window.addEventListener('popstate',()=>{const p=new URLSearchParams(location.search);if(manifest.some(w=>w.id===p.get('week')))state.week=p.get('week');if(VIEWS.includes(p.get('view')))state.view=p.get('view');if(BOARDS.includes(p.get('tab')))state.tab=p.get('tab');if(window.I18N[p.get('lang')])lang=p.get('lang');if(['light','dark'].includes(p.get('theme')))document.documentElement.dataset.theme=p.get('theme');closeProfile();state.player=p.get('player')||'';render()});
render();
})();
</script>
</body>
